name: web
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Rust tests (native, and with the browser clock path)
        run: |
          cargo test --release
          cargo test --release --lib --features host-clock
      - name: Clippy
        run: cargo clippy --release --all-targets
      - name: JS glue tests
        run: node --test tests/glue.test.mjs tests/models.test.mjs
      - name: The wasm module builds and exports the expected functions
        env:
          RUSTFLAGS: -C link-arg=--import-undefined
        run: |
          cargo rustc --lib --release --target wasm32-unknown-unknown --crate-type cdylib
          node -e '
            const fs = require("fs");
            const m = new WebAssembly.Module(fs.readFileSync("target/wasm32-unknown-unknown/release/tinybot.wasm"));
            const ex = WebAssembly.Module.exports(m).map(e => e.name);
            const imp = WebAssembly.Module.imports(m).map(i => i.module + "." + i.name).sort();
            for (const n of ["memory","tb_alloc","tb_free","tb_init","tb_reply","tb_state","tb_tick","tb_timers","tb_cancel_timer","tb_set_model","tb_model_info","tb_result_ptr"]) if (!ex.includes(n)) throw new Error("missing export " + n);
            const want = ["env.host_now_ms","env.host_perf_ms","env.host_random","env.host_tz_offset_min"];
            if (JSON.stringify(imp) !== JSON.stringify(want)) throw new Error("unexpected imports: " + imp);
            console.log("ok", ex.length, "exports,", imp.length, "imports");
          '
      - name: End to end in Node (real wasm + shipped model)
        run: node tests/e2e.mjs
