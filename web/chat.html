<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat · TinyBot</title>
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ffb347'/%3E%3Ccircle cx='11' cy='14' r='2.6' fill='%230e0d0b'/%3E%3Ccircle cx='21' cy='14' r='2.6' fill='%230e0d0b'/%3E%3Cpath d='M10 21q6 4 12 0' stroke='%230e0d0b' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body class="chat">
  <header class="top">
    <a class="mark" href="./" aria-label="TinyBot home"><span class="mark-face" aria-hidden="true">•‿•</span><span>tinybot</span></a>
    <nav aria-label="Page">
      <a href="./"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Home</a>
      <a href="https://github.com/Trushi28/tinybot" rel="noopener"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5"/></svg>Source</a>
      <button type="button" id="theme" class="icon" aria-label="Switch colour theme" title="Switch colour theme">
        <svg class="ic sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="ic moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      </button>
    </nav>
  </header>

  <main class="stage" id="chat" aria-label="Chat with TinyBot">
    <div class="console">
      <div class="console-bar">
        <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="console-title" id="status">warming up…</span>
        <span class="console-actions">
          <button type="button" id="help" class="link">/help</button>
          <button type="button" id="reset" class="link" title="Forget your notes, XP and progress on this device">forget me</button>
        </span>
      </div>
      <div id="log" class="log" tabindex="0" aria-label="Conversation"></div>
      <div id="announce" class="sr" aria-live="polite"></div>
      <div class="chips" id="chips" hidden>
        <button type="button" data-q="what is 12*(3+4)">12*(3+4)</button>
        <button type="button" data-q="10 km to miles">10 km to miles</button>
        <button type="button" data-q="what is the capital of turkey">capital of Turkey</button>
        <button type="button" data-q="tell me a joke">tell me a joke</button>
        <button type="button" data-q="roll 3d6+2">roll 3d6+2</button>
        <button type="button" data-q="set a timer for 30 seconds">30 s timer</button>
        <button type="button" data-q="play rock paper scissors">rock paper scissors</button>
      </div>
      <form id="form" autocomplete="off">
        <label class="sr" for="input">Message</label>
        <span class="prompt" aria-hidden="true">you ▸</span>
        <input id="input" type="text" maxlength="400" placeholder="say something, or try /help" disabled enterkeyhint="send" spellcheck="false">
        <button type="submit" id="send" disabled aria-label="Send"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </form>
    </div>

    <aside class="brain" aria-label="What the network is thinking">
      <div class="face-wrap">
        <svg id="face" class="face" viewBox="0 0 200 160" role="img" aria-label="TinyBot's face" data-emo="neutral">
          <rect class="head" x="14" y="12" width="172" height="136" rx="38"/>
          <g id="eyes"></g>
          <g id="mouth"></g>
        </svg>
        <p class="mood"><span id="mood">neutral</span></p>
      </div>
      <h2>Routed to</h2>
      <p class="route" id="route"><span class="idle">waiting for your first message</span></p>
      <h2>Top guesses</h2>
      <ol class="bars" id="bars"><li class="idle">intent probabilities appear here</li></ol>
      <h2>Words that mattered</h2>
      <p class="words" id="words"><span class="idle">leave-one-word-out influence</span></p>
      <p class="meter" id="meter" aria-live="off"></p>
    </aside>
  </main>

  <noscript><p class="noscript">TinyBot needs JavaScript and WebAssembly.</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
